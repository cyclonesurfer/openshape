[workspace]
resolver = "2"
members = [
    "crates/oplog",
    "crates/core-model",
    "crates/nurbs",
    "crates/kernel",
    "crates/naming",
    "crates/features",
    "crates/render",
    "crates/io",
    "crates/ui",
    "crates/ui-kit",
    "crates/linalg",
    "crates/sketch-solver",
    "crates/text",
]
# Patched copies of crates.io packages (vendor/README.md); they are
# dependencies, not members.
exclude = ["vendor/spade"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/cyclonesurfer/openshape"
authors = ["OpenDatum contributors"]

[workspace.dependencies]
opendatum-oplog = { path = "crates/oplog", version = "0.1.0" }
opendatum-core-model = { path = "crates/core-model", version = "0.1.0" }
opendatum-nurbs = { path = "crates/nurbs", version = "0.1.0" }
opendatum-kernel = { path = "crates/kernel", version = "0.1.0" }
opendatum-naming = { path = "crates/naming", version = "0.1.0" }
opendatum-features = { path = "crates/features", version = "0.1.0" }
opendatum-render = { path = "crates/render", version = "0.1.0" }
opendatum-io = { path = "crates/io", version = "0.1.0" }
opendatum-linalg = { path = "crates/linalg", version = "0.1.0" }
opendatum-sketch-solver = { path = "crates/sketch-solver", version = "0.1.0" }
opendatum-ui-kit = { path = "crates/ui-kit", version = "0.1.0" }
opendatum-text = { path = "crates/text", version = "0.1.0" }

glam = { version = "0.34", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
thiserror = "2"
robust = "1.2"
spade = "2.15"
rustc-hash = "2.1"
smallvec = "1.13"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
pollster = "1"
png = "0.18"
eframe = { version = "0.36", default-features = false }
winit = { version = "0.30", default-features = false }
egui = "0.36"
egui-wgpu = "0.36"
proptest = "1"
log = "0.4"
harfrust = "0.14"
skrifa = { version = "0.48", default-features = false, features = ["std"] }
env_logger = "0.11"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# Patched copies of crates.io packages, each with its reason and its
# changes in vendor/README.md.
[patch.crates-io]
spade = { path = "vendor/spade" }
