# cargo-deny configuration. See docs/adr/0009-dependency-licensing.md.
# Every dependency must be compatible with GPL-3.0-or-later.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate advisories are reported but only fail for direct deps.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# The allowlist is policy, not inventory: entries may be unused today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
