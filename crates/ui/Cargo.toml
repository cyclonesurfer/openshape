[package]
name = "openshape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenShape desktop application"

[lib]
name = "openshape_app"
path = "src/lib.rs"

[[bin]]
name = "openshape"
path = "src/main.rs"

[dependencies]
openshape-core-model.workspace = true
openshape-kernel.workspace = true
openshape-features.workspace = true
openshape-render.workspace = true
openshape-io.workspace = true
openshape-sketch-solver.workspace = true
openshape-text.workspace = true
openshape-ui-kit.workspace = true
glam.workspace = true
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
# Not used directly: turns on the GNOME-style (Adwaita) title bar winit
# draws on Wayland desktops that leave decorations to the app (GNOME), in
# place of its bare fallback frame. eframe's defaults would enable it, but
# they are off here.
winit = { workspace = true, features = ["wayland-csd-adwaita"] }
egui.workspace = true
egui-wgpu.workspace = true
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
